name: CAT, network and audio validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_windows:
        description: 'Publish a Windows executable (explicit request only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - run: dotnet restore Ftx1.sln
      - run: dotnet build Ftx1.sln -c Release --no-restore
      - run: dotnet test Ftx1.sln -c Release --no-build -m:1 --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_windows) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && startsWith(github.head_ref, 'feat/stage'))
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - run: dotnet publish src/Ftx1.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/desktop
      - run: dotnet publish src/Ftx1.Server -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/server
      - name: Verify packaged server on Windows
        run: dotnet run --project tools/Ftx1.PackageSmoke -c Release -- artifacts/server/FTX1-Server.exe
      - shell: pwsh
        run: |
          (Get-FileHash artifacts/desktop/FTX1-CATandRemote.exe -Algorithm SHA256).Hash + '  FTX1-CATandRemote.exe' | Out-File artifacts/desktop/SHA256.txt
          (Get-FileHash artifacts/server/FTX1-Server.exe -Algorithm SHA256).Hash + '  FTX1-Server.exe' | Out-File artifacts/server/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FTX1-CATandRemote-win-x64
          path: |
            artifacts/desktop/FTX1-CATandRemote.exe
            artifacts/desktop/SHA256.txt
            artifacts/server/FTX1-Server.exe
            artifacts/server/SHA256.txt
            README.md
            THIRD_PARTY_NOTICES.md
            licenses/*.txt

  android:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install android --skip-manifest-update
      - name: Build standalone debug-signed APK
        run: dotnet build src/Ftx1.Android -c Debug -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:EmbedAssembliesIntoApk=true
      - name: Stage Android package
        run: |
          mkdir -p artifacts/android
          cp src/Ftx1.Android/bin/Debug/net8.0-android/*-Signed.apk artifacts/android/FTX1-Remote-Android.apk
          sha256sum artifacts/android/FTX1-Remote-Android.apk > artifacts/android/SHA256.txt
      - name: Build isolated emulator-test APK
        run: dotnet build src/Ftx1.Android -c Debug -p:SmokeTestBuild=true -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:EmbedAssembliesIntoApk=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r src/Ftx1.Android/bin/Debug/net8.0-android/ro.eugen68.ftx1remote-Signed.apk
            python3 tools/android_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: FTX1-Remote-Android
          path: artifacts/android/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: artifacts/android-emulator.log
